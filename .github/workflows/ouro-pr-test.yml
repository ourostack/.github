name: ouro-pr tests

on:
  pull_request:
    paths: ["tools/ouro-pr/**", ".github/workflows/ouro-pr*.yml"]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: bash tools/ouro-pr/test/run.sh
