name: brand audit

# Checks every surface in brand/surfaces.json against brand/provenance.json.
# Red means a surface is stale: see brand/AGENTS.md. Not a required check, because a
# brand pull request has to merge before other repositories can point at its files.
on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "23 7 * * *"
  workflow_dispatch:

permissions:
  contents: read

# A newer push to a pull request cancels its older run. Runs not triggered by a pull request each
# get their own group, so they are never cancelled.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Audit every brand surface
        env:
          GH_TOKEN: ${{ github.token }}
          BRAND_COMMIT: ${{ github.event_name != 'pull_request' && github.sha || '' }}
          BRAND_REF: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || '' }}
        run: node brand/tools/audit.mjs --format text

  upscale-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Test how upscale.py builds night masters
        run: |
          python3 -m venv /tmp/upscale-venv
          /tmp/upscale-venv/bin/pip install --quiet pillow numpy scipy scikit-image
          /tmp/upscale-venv/bin/python brand/tools/upscale_test.py -v
      # Required with the upscale tests: a night whose sky has a hard straight seam can't merge.
      - name: Test how sky_seams.py tells a build seam from a drawn edge
        run: /tmp/upscale-venv/bin/python brand/tools/sky_seams_test.py -v
      - name: Check every light-transfer night's sky for straight seams
        run: /tmp/upscale-venv/bin/python brand/tools/sky_seams.py

  pending-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Test how the audit tells a sync in flight from stale
        run: node --test brand/tools/pending.test.mjs brand/tools/canonical.test.mjs

  # Always runs on every pull request (no path filter), so it can be a required check.
  red-main-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Test red-main, its owner routing and the auto-revert guards
        run: node --test tools/red-main/red-main.test.mjs tools/red-main/auto-revert.test.mjs
