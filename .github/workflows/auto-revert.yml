name: Auto-revert red main

# When main's newest completed run is red, this traces each failure to the pull request that caused it and, once the failure
# reproduces (a rerun, or two runs in a row), is not infrastructure and main has been red an hour, opens its revert with
# auto-merge and wakes the repo's owner. Every guard and the opt-in list
# (tools/red-main/auto-revert.json) are in tools/red-main/auto-revert.mjs. The tests run with red-main's.
#
# Needs the REARM_MERGES_TOKEN secret with contents and pull-request write on the opted-in repositories. Without it the
# job says so in a notice and does nothing.
on:
  schedule:
    - cron: "4-59/10 * * * *"
  workflow_dispatch:
    inputs:
      apply:
        description: "Act (rerun and revert). Off is a dry run."
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: auto-revert
  cancel-in-progress: false

jobs:
  auto-revert:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Check what the token can do
        env:
          GH_TOKEN: ${{ secrets.REARM_MERGES_TOKEN }}
        shell: bash
        run: |
          [ -n "$GH_TOKEN" ] || exit 0
          node tools/red-main/token-check.mjs | tee -a "$GITHUB_STEP_SUMMARY"
      # The blobless clone of each red repository and every finished job's parsed failures, so a tick reads only what is new.
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/auto-revert
          key: auto-revert-${{ github.run_id }}
          restore-keys: auto-revert-
      - name: Revert what keeps main red
        env:
          GH_TOKEN: ${{ secrets.REARM_MERGES_TOKEN }}
          APPLY: ${{ github.event_name != 'workflow_dispatch' || inputs.apply }}
        shell: bash
        run: |
          [ -n "$GH_TOKEN" ] || { echo "::notice::The REARM_MERGES_TOKEN secret is not set; nothing was checked."; exit 0; }
          flag=""; [ "$APPLY" = "true" ] && flag="--apply"
          node tools/red-main/auto-revert.mjs $flag --cache "$RUNNER_TEMP/auto-revert/jobs.json" 2>&1 | tee -a "$GITHUB_STEP_SUMMARY"
