name: Re-run flaky main failures once

# An Ouro UI release update changes only a pin file, yet main went red after one: a macOS timing test and a WebKit
# test flaked in main-only runs (flow-review on 11-19 and 11-20: 13 of the last 14 main failures, m365crawl's macOS
# test job). Every 5 minutes this re-runs the failed jobs, once, of each ourostack default-branch push run that
# failed on its first attempt. A flake passes and main is green again; a real break fails twice and stays red for
# tools/red-main to count. Reuses the REARM_MERGES_TOKEN secret (needs actions:write in every ourostack repository).
on:
  schedule:
    - cron: "2-59/5 * * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["tools/rerun-main-flakes/**", ".github/workflows/rerun-main-flakes.yml"]
  pull_request:
    paths: ["tools/rerun-main-flakes/**", ".github/workflows/rerun-main-flakes.yml"]

permissions:
  contents: read

concurrency:
  group: rerun-main-flakes-${{ github.event_name == 'pull_request' && github.ref || 'main' }}
  cancel-in-progress: false

jobs:
  rerun:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Test the selection
        run: node --test tools/rerun-main-flakes/rerun-main-flakes.test.mjs
      - name: Re-run
        if: github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ secrets.REARM_MERGES_TOKEN }}
        shell: bash
        run: |
          [ -n "$GH_TOKEN" ] || { echo "::notice::The REARM_MERGES_TOKEN secret is not set; nothing was re-run."; exit 0; }
          node tools/rerun-main-flakes/rerun-main-flakes.mjs 2>&1 | tee -a "$GITHUB_STEP_SUMMARY"
