name: Red main tests

# Tests for tools/red-main: the red-minutes measure and the red-main owner routing.
on:
  push:
    branches: [main]
    paths: ["tools/red-main/**", ".github/workflows/red-main.yml"]
  pull_request:
    paths: ["tools/red-main/**", ".github/workflows/red-main.yml"]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: node --test tools/red-main/red-main.test.mjs
