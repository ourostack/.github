name: Auto-revert red main (reusable)

# Opt a repository into auto-revert with its own token, no cross-repo secret. The caller is the whole opt-in:
# tools/red-main/README.md has the caller file. Guards and behaviour: tools/red-main/auto-revert.mjs.
on:
  workflow_call:
    inputs:
      apply:
        description: "Act (verify and revert). False is a dry run."
        type: boolean
        default: true
    secrets:
      token:
        description: "Optional PAT or App token, used only for writes (revert branch, PR, auto-merge, merging its own green revert, the verify branch and its workflow_dispatch); reads, check runs and annotations included, use the caller's GITHUB_TOKEN. Without it the caller's GITHUB_TOKEN is used, and a PR it opens does not start the repository's pull_request workflows."
        required: false

jobs:
  auto-revert:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
      pull-requests: write
      actions: write
      checks: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ourostack/.github
          ref: main
          path: .ouro-tools
      # The blobless clone of each red repository and every finished job's parsed failures, so a tick reads only what is new.
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/auto-revert
          key: auto-revert-${{ github.run_id }}
          restore-keys: auto-revert-
      - name: Revert what keeps main red
        env:
          GH_TOKEN: ${{ secrets.token || github.token }}
          READ_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          APPLY: ${{ inputs.apply }}
        shell: bash
        run: |
          flag=""; [ "$APPLY" = "true" ] && flag="--apply"
          node .ouro-tools/tools/red-main/auto-revert.mjs --self "$REPO" $flag --cache "$RUNNER_TEMP/auto-revert/jobs.json" 2>&1 | tee -a "$GITHUB_STEP_SUMMARY"
